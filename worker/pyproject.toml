[build-system]
requires = ["setuptools>=80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "launchpad-worker"
version = "0.1.0"
description = "Discovery worker for the Launchpad job discovery application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic-settings==2.16.2",
  "structlog==26.1.0",
  "supabase==2.33.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[project.scripts]
launchpad-worker = "launchpad_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "unit: deterministic tests that do not access live job sources",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["launchpad_worker"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["supabase", "supabase.*"]
ignore_missing_imports = true
